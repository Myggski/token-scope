# Builds the Windows installer and publishes a GitHub release when a version tag is pushed:
#   git tag v1.0.1 && git push origin v1.0.1
# The release text comes from .github/release-notes.md. The tests run in their own job on Windows,
# so a failing test shows up here without stopping the release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TokenScope-Setup-*.exe \
            --title "TokenScope ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
