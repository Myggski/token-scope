# Builds the Windows installer and publishes it as a GitHub release, for the version in package.json.
# Start it from GitHub: Actions → Release → Run workflow. (Pushing a tag like v1.0.1 starts it too.)
# The release text comes from .github/release-notes.md. The tests run in their own job on Windows,
# so a failing test shows up here without stopping the release.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          ls dist
          set +e
          gh release create "$version" dist/TokenScope-Setup-*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TokenScope ${version#v}" \
            --notes-file .github/release-notes.md > publish.log 2>&1
          code=$?
          cat publish.log
          if [ $code -ne 0 ]; then sed 's/^/::error::/' publish.log; fi
          exit $code

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the tests
        shell: bash
        # A failure becomes one note on the run, readable without downloading the log: what came after
        # the last test that passed (GitHub shows at most 10 notes, so it's one note, not one per line).
        run: |
          set +e
          npm test > test.log 2>&1
          code=$?
          cat test.log
          if [ $code -ne 0 ]; then
            last=$(grep -n "passed" test.log | tail -n 1 | cut -d: -f1)
            tail -n +$(( ${last:-0} + 1 )) test.log | grep -v "^> \|^$" | head -n 40 > failure.txt
            echo "::error title=Tests failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' failure.txt)"
          fi
          exit $code
